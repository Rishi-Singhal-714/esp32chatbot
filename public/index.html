<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zulu Bot</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0a0b0f;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px;
      }

      /* ── Header ── */
      header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 40px;
      }

      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4f8ef7, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }

      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff;
        letter-spacing: -0.02em;
      }

      /* ── Status pill ── */
      .status-pill {
        display: flex;
        align-items: center;
        gap: 7px;
        background: #1a1d27;
        border: 1px solid #2a2d3a;
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 0.78rem;
        color: #aaa;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4caf50;
        animation: breathe 2.4s ease-in-out infinite;
      }

      @keyframes breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.4; transform: scale(0.85); }
      }

      /* ── Feed ── */
      #feed {
        width: 100%;
        max-width: 580px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Empty state ── */
      #empty {
        text-align: center;
        margin-top: 48px;
        color: #333;
      }

      #empty .mic-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.3;
      }

      #empty p {
        font-size: 0.9rem;
        line-height: 1.8;
        color: #444;
      }

      /* ── Conversation card ── */
      .card {
        background: #13151f;
        border: 1px solid #1e2130;
        border-radius: 16px;
        overflow: hidden;
        animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .card-row {
        display: flex;
        gap: 12px;
        padding: 14px 18px;
        align-items: flex-start;
      }

      .card-row + .card-row {
        border-top: 1px solid #1e2130;
        background: #0f1117;
      }

      .role-badge {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        padding: 3px 8px;
        border-radius: 5px;
        white-space: nowrap;
        margin-top: 2px;
      }

      .role-badge.you {
        background: #1e3a6e;
        color: #74a8f7;
      }

      .role-badge.bot {
        background: #1a3326;
        color: #4caf50;
      }

      .card-text {
        font-size: 0.93rem;
        line-height: 1.6;
        color: #d0d0d0;
        flex: 1;
      }

      .card-time {
        font-size: 0.7rem;
        color: #333;
        white-space: nowrap;
        margin-top: 3px;
      }
    </style>
  </head>
  <body>

    <header>
      <div class="avatar">🤖</div>
      <h1>Zulu Bot</h1>
      <div class="status-pill">
        <div class="status-dot"></div>
        Always listening
      </div>
    </header>

    <div id="feed">
      <div id="empty">
        <div class="mic-icon">🎙️</div>
        <p>Zulu Bot is live and listening.<br>Just speak — it will respond.</p>
      </div>
    </div>

    <script>
      const feed  = document.getElementById("feed");
      let lastTs  = 0;

      async function poll() {
        try {
          const res  = await fetch("/api/message");
          const { messages } = await res.json();
          const fresh = (messages || []).filter(m => m.ts > lastTs);
          if (!fresh.length) return;

          document.getElementById("empty")?.remove();

          fresh.forEach(m => {
            lastTs = Math.max(lastTs, m.ts);

            const time = new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <div class="card-row">
                <span class="role-badge you">You</span>
                <span class="card-text">${esc(m.user)}</span>
                <span class="card-time">${time}</span>
              </div>
              <div class="card-row">
                <span class="role-badge bot">Zulu</span>
                <span class="card-text">${esc(m.bot)}</span>
              </div>`;

            feed.appendChild(card);
            card.scrollIntoView({ behavior: "smooth", block: "end" });
          });
        } catch (_) {}
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      poll();
      setInterval(poll, 2000);
    </script>
  </body>
</html>
